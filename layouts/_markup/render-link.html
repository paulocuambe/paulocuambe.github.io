{{- $url := urls.Parse .Destination -}}
{{- $external := and $url.Host (ne $url.Host (urls.Parse site.BaseURL).Host) -}}
<a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $external }} target="_blank" rel="external noopener noreferrer"{{ end }}>{{ .Text | safeHTML }}{{ if $external }}<span class="external-mark" aria-label="(external link, opens in a new tab)">↗</span>{{ end }}</a>
